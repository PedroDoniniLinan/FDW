# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: "dbt_"
version: "1.0.0"

# This setting configures which "profile" dbt uses for this project.
profile: "dbt_"

# These configurations specify where dbt should look for different types
# of files. The `model-paths` config, for example, states that models in
# this project can be found in the "models/" directory. You probably won't
# need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# directories to be removed by `dbt clean`
clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

models:
  dbt_:
    +on_schema_change: sync_all_columns
    +schema: silver
    +materialized: view
    3_marts:
      +schema: gold
      +materialized: table

seeds:
  dbt_:
    +schema: seeds

vars:
  lookback_days: 30
  lookback_days_: 900
  lookback_days_eop: 365
