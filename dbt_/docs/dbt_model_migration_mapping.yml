version: 1

# Inventory of legacy models under dbt_/models/deprecated and their replacements
# in the active dbt_/models tree.  A model can map to more than one replacement
# when the refactor split one legacy relation into several grains or layers.
source_root: dbt_/models/deprecated
target_root: dbt_/models

status_definitions:
  migrated: An active replacement was found by lineage and/or Git rename history.
  partial: Some responsibilities moved, but no one-to-one replacement was found.
  not_migrated: No active replacement was found in the current model tree.

