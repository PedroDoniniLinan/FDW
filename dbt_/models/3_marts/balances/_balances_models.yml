---
version: 2

models:
  - name: agg_blc__allocation_metrics
    description: >
      Current allocation by asset hierarchy, compared with target allocations
      after excluding emergency reserves, including actionable balance deltas.
    columns:
      - name: currency
        data_type: character varying
      - name: asset_level
        data_type: text
      - name: level_1
        data_type: text
      - name: level_2
        data_type: text
      - name: asset
        data_type: text
      - name: available_balance
        data_type: numeric
      - name: allocation
        data_type: numeric
      - name: target_allocation
        data_type: numeric
      - name: allocation_delta
        data_type: numeric
      - name: balance_delta
        data_type: numeric
      - name: is_actionable
        data_type: boolean

  - name: fct_blc__balances_enriched_daily
    config:
      event_time: calendar_date
    description: >
      Daily balances enriched with account attributes and hierarchical
      classifications. Provides the foundation for detailed balance analysis
      across accounts, currencies, and budget categories with full
      dimensional context.
      **Event time**: calendar_date
    columns:
      - name: balance_id
        data_type: uuid
        description: "{{ doc('balance_id') }}"
        tests:
          - unique:
              config:
                where: >
                  calendar_date >= current_date -
                  interval '{{ var("lookback_days", 30) + 30 }} days'
          - not_null:
              config:
                where: >
                  calendar_date >= current_date -
                  interval '{{ var("lookback_days", 30) + 30 }} days'
      - name: calendar_date
        data_type: date
        description: "{{ doc('calendar_date') }}"
        tests:
          - not_null
      - name: is_end_of_period
        data_type: text
        description: "{{ doc('is_end_of_period') }}"
        tests:
          - not_null
      - name: asset
        data_type: character varying
        description: "{{ doc('asset') }}"
        tests:
          - not_null
      - name: currency
        data_type: text
        description: "{{ doc('currency') }}"
        tests:
          - not_null
      - name: account
        data_type: character varying
        description: "{{ doc('account') }}"
        tests:
          - not_null:
              config:
                where: >
                  calendar_date >= current_date -
                  interval '{{ var("lookback_days", 30) + 30 }} days'
      - name: account_country
        data_type: text
        description: "{{ doc('account_country') }}"
        tests:
          - not_null
      - name: account_ownership
        data_type: text
        description: "{{ doc('account_ownership') }}"
        tests:
          - not_null
      - name: financial_level_1
        data_type: text
        description: "{{ doc('financial_level_1') }}"
        tests:
          - not_null
      - name: financial_level_2
        data_type: text
        description: "{{ doc('financial_level_2') }}"
        tests:
          - not_null
      - name: budget_level_1
        data_type: text
        description: "{{ doc('budget_level_1') }}"
        tests:
          - not_null
      - name: budget_level_2
        data_type: text
        description: "{{ doc('budget_level_2') }}"
        tests:
          - not_null
      - name: budget_level_3
        data_type: text
        description: "{{ doc('budget_level_3') }}"
        tests:
          - not_null
      - name: balance
        data_type: double precision
        description: "{{ doc('balance') }}"
        tests:
          - not_null

  - name: fct_blc__balances_enriched_eop
    description: >
      Period-end balance snapshots aggregated across multiple time grains.
      Filters daily balances to end-of-period dates and supports analysis at
      day, week, month, quarter, and year levels.
      **Event time**: calendar_date
    columns:
      - name: grain_id
        data_type: uuid
        description: "{{ doc('grain_id') }}"
        tests:
          - not_null
          - unique
      - name: balance_id
        data_type: uuid
        description: "{{ doc('balance_id') }}"
        tests:
          - not_null
      - name: calendar_date
        data_type: date
        description: "{{ doc('calendar_date') }}"
        tests:
          - not_null
      - name: time_grain
        data_type: text
        description: "{{ doc('time_grain') }}"
        tests:
          - not_null
      - name: currency
        data_type: text
        description: "{{ doc('currency') }}"
        tests:
          - not_null
      - name: account
        data_type: character varying
        description: "{{ doc('account') }}"
        tests:
          - not_null
      - name: account_country
        data_type: text
        description: "{{ doc('account_country') }}"
        tests:
          - not_null
      - name: account_ownership
        data_type: text
        description: "{{ doc('account_ownership') }}"
        tests:
          - not_null
      - name: financial_level_1
        data_type: text
        description: "{{ doc('financial_level_1') }}"
        tests:
          - not_null
      - name: financial_level_2
        data_type: text
        description: "{{ doc('financial_level_2') }}"
        tests:
          - not_null
      - name: budget_level_1
        data_type: text
        description: "{{ doc('budget_level_1') }}"
        tests:
          - not_null
      - name: budget_level_2
        data_type: text
        description: "{{ doc('budget_level_2') }}"
        tests:
          - not_null
      - name: budget_level_3
        data_type: text
        description: "{{ doc('budget_level_3') }}"
        tests:
          - not_null
      - name: balance
        data_type: double precision
        description: "{{ doc('balance') }}"
        tests:
          - not_null
