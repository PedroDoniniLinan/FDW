---
version: 2

models:
  - name: fct_inv__rates_daily
    description: >
      Intermediate model that combines and unifies staging exchange rate data
      with all possible fiat exchange rate combinations (USD, EUR and BRL).
    columns:
      - name: rate_id
        data_type: uuid
        description: "{{ doc('rate_id') }}"
        tests:
          - not_null
          - unique
      - name: asset
        data_type: character varying
        description: "{{ doc('asset') }}"
        tests:
          - not_null
      - name: exchange_asset
        data_type: character varying
        description: "{{ doc('exchange_asset') }}"
        tests:
          - not_null
      - name: calendar_date
        data_type: date
        description: "{{ doc('calendar_date') }}"
        tests:
          - not_null
      - name: exchange_rate
        data_type: numeric
        description: "{{ doc('exchange_rate') }}"

  - name: int_inv__rates_fiat_combinations_daily
    description: >
      Intermediate model that generates all necessary pairs and permutations
      of fiat currency exchange rates to ensure full cross-rate coverage.
    columns:
      - name: rate_id
        data_type: uuid
        description: "{{ doc('rate_id') }}"
        tests:
          - not_null
          - unique
      - name: asset
        data_type: character varying
        description: "{{ doc('asset') }}"
        tests:
          - not_null
      - name: exchange_asset
        data_type: character varying
        description: "{{ doc('exchange_asset') }}"
        tests:
          - not_null
      - name: calendar_date
        data_type: date
        description: "{{ doc('calendar_date') }}"
        tests:
          - not_null
      - name: exchange_rate
        data_type: numeric
        description: "{{ doc('exchange_rate') }}"

  - name: int_inv__rates_interpolated_daily
    description: >
      Intermediate model that fills in missing dates for exchange rates (such
      as weekends or holidays) using forward-filling or interpolation logic
      to guarantee a continuous daily time series.
    columns:
      - name: rate_id
        data_type: uuid
        description: "{{ doc('rate_id') }}"
        tests:
          - not_null
          - unique
      - name: asset
        data_type: character varying
        description: "{{ doc('asset') }}"
        tests:
          - not_null
      - name: exchange_asset
        data_type: character varying
        description: "{{ doc('exchange_asset') }}"
        tests:
          - not_null
      - name: calendar_date
        data_type: date
        description: "{{ doc('calendar_date') }}"
        tests:
          - not_null
      - name: is_end_of_period
        data_type: text
        description: "{{ doc('is_end_of_period') }}"
        tests:
          - not_null
      - name: exchange_rate
        data_type: numeric
        description: "{{ doc('exchange_rate') }}"

  - name: fct_inv__rates_fiat_daily
    config:
      event_time: calendar_date
    description: >
      Intermediate model that converts non-fiat asset prices or alternative
      currency rates into standardized daily fiat equivalents based on
      unified exchange rate calculations.
      **Event time**: calendar_date
    columns:
      - name: rate_id
        data_type: uuid
        description: "{{ doc('rate_id') }}"
        tests:
          - not_null
          - unique
      - name: calendar_date
        data_type: date
        description: "{{ doc('calendar_date') }}"
        tests:
          - not_null
      - name: is_end_of_period
        data_type: text
        description: "{{ doc('is_end_of_period') }}"
        tests:
          - not_null
      - name: asset
        data_type: character varying
        description: "{{ doc('asset') }}"
        tests:
          - not_null
      - name: currency
        data_type: character varying
        description: "{{ doc('currency') }}"
        tests:
          - not_null
      - name: exchange_rate
        data_type: numeric
        description: "{{ doc('exchange_rate') }}"

  - name: agg_inv__yield_daily
    description: >
      Daily balances and qualifying investment income classified by budget
      levels 1, 2, and 3, per currency. Only rows with all three budget levels
      are kept. Includes the previous day's balance and the daily external
      flow (balance change not explained by interest), used for Modified Dietz.
    columns:
      - name: calendar_date
        data_type: date
      - name: currency
        data_type: text
      - name: budget_level_1
        data_type: text
      - name: budget_level_2
        data_type: text
      - name: budget_level_3
        data_type: text
      - name: balance
        data_type: double precision
      - name: interest
        data_type: numeric
      - name: prev_balance
        data_type: double precision
      - name: flow
        data_type: double precision
        description: "balance - prev_balance - interest"
