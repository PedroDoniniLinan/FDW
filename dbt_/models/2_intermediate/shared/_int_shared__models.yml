---
version: 2

models:
  - name: int_com__calendar_daily
    time_spine:
      standard_granularity_column: calendar_date
    description: >
      Intermediate calendar spine model that generates a continuous,
      unbroken sequence of daily dates (from 2019-08-01 until the last day
      of data). This serves as a central reference dimension used to scaffold
      downstream time-series metrics and join sparse datasets across shared
      dates.
    columns:
      - name: calendar_date
        data_type: date
        description: "{{ doc('calendar_date') }}"
        tests:
          - not_null
          - unique
        granularity: day
      - name: is_end_of_period
        data_type: text
        description: "{{ doc('is_end_of_period') }}"
        tests:
          - not_null

  - name: int_com__account_calendar_daily
    description: >
      Intermediate spine model that generates a continuous date scaffold for
      every active account. This forces a row for every account-day
      combination, ensuring metrics (like daily balances or activity) can be
      fully tracked without gaps on days with zero transactions.
    columns:
      - name: account
        data_type: character varying
        description: "{{ doc('account') }}"
        tests:
          - not_null
      - name: asset
        data_type: character varying
        description: "{{ doc('asset') }}"
        tests:
          - not_null
      - name: calendar_date
        data_type: date
        description: "{{ doc('calendar_date') }}"
        tests:
          - not_null
      - name: is_end_of_period
        data_type: text
        description: "{{ doc('is_end_of_period') }}"
        tests:
          - not_null
