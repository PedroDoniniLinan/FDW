version: 2

models:
  - name: int_prj__dividend_yields_monthly
    description: >
      Monthly EUR dividend yield by allocated income category and ticker,
      calculated from active transaction and balance facts.
    columns:
      - name: currency
        data_type: text
      - name: calendar_date
        data_type: date
      - name: budget_level_3
        data_type: character varying
      - name: ticker
        data_type: character varying
      - name: amount
        data_type: numeric
      - name: balance
        data_type: double precision
      - name: performance
        data_type: double precision

  - name: int_prj__price_yields_monthly
    description: >
      Monthly price and dividend performance by allocated income category,
      including a monthly history filler before the first observed rate.
    columns:
      - name: currency
        data_type: text
      - name: budget_level_3
        data_type: character varying
      - name: calendar_date
        data_type: date
      - name: performance
        data_type: double precision

  - name: fct_prj__transactions_monthly
    description: >
      Monthly projection transactions scaffolded to the projection calendar,
      categorized with the active transaction category dimension, and
      aggregated by simulation, category, and projection frequency.
    columns:
      - name: calendar_date
        data_type: date
        tests:
          - not_null
      - name: is_end_of_period
        data_type: text
      - name: simulation_set
        data_type: integer
      - name: frequency
        data_type: text
      - name: source
        data_type: text
      - name: transaction_type
        data_type: character varying
      - name: budget_level_1
        data_type: character varying
      - name: financial_level_2
        data_type: character varying
      - name: amount
        data_type: double precision

  - name: fct_prj__apports_monthly
    description: >
      Monthly projected apport aggregated by calendar date and simulation set.
    columns:
      - name: calendar_date
        data_type: date
        tests:
          - not_null
      - name: is_end_of_period
        data_type: text
      - name: simulation_set
        data_type: integer
      - name: apport
        data_type: double precision

  - name: fct_prj__balances_monthly
    description: >
      Monthly projected balances per simulation set, seeded from the EUR
      balance on December 31, 2023 excluding Nubank C and compounded monthly
      using each simulation set's fixed rate plus that month's apports.
    columns:
      - name: calendar_date
        data_type: date
        tests:
          - not_null
      - name: simulation_set
        data_type: integer
        tests:
          - not_null
      - name: balance
        data_type: double precision

  - name: int_prj__calendar_monthly
    description: >
      Monthly calendar spine used to scaffold projection models from December
      2023 through December 2050, with quarter and year end markers.
    columns:
      - name: calendar_date
        data_type: date
        description: "{{ doc('calendar_date') }}"
        tests:
          - not_null
          - unique
      - name: is_end_of_period
        data_type: text
        description: "{{ doc('is_end_of_period') }}"
        tests:
          - not_null

  - name: int_prj__yield_stats
    description: >
      Annualized historical EUR yield statistics by allocated income category,
      weighted by the active simulation allocation targets.
    columns:
      - name: budget_level_3
        data_type: character varying
      - name: avg_pos_yield
        data_type: double precision
      - name: avg_neg_yield
        data_type: double precision
      - name: pos_year_pct
        data_type: numeric
      - name: target_allocation
        data_type: numeric
      - name: allocation_pos_yield
        data_type: double precision
      - name: allocation_neg_yield
        data_type: double precision
